[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "zentry-ia"
dynamic = ["version"]
description = "IA para controle de acesso: monitora catracas e faciais (Control iD), detecta riscos, aprende, fala e conversa."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["tzdata; sys_platform == 'win32'"]
keywords = ["controle de acesso", "catraca", "control id", "idface", "seguranca"]

[project.scripts]
zentry = "zentry.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "zentry.__version__" }

[tool.setuptools.packages.find]
include = ["zentry*"]

[tool.setuptools.package-data]
zentry = ["web/*"]
